                      - generic: "It’s late, you need to get home, and the bus that finally stops for you is not an ordinary bus. Every stop is worse than the last. Passengers remember things that never happened. A seat you saw empty is suddenly occupied. Your reflection moves a second too late. Across ten stops you’ll search a roadside, a bus full of secrets, a market where the lost things are waiting, and a house that shouldn’t be between stops. You’ll learn each creature’s rule: when to freeze, when to hide, when to be silent, when to turn around, and when to hold the torch steady. Every clue you find goes into your journal, and some of them contradict each other. Your choices decide what you believe about yourself, who you trust, and how the ride ends. There are ten endings. Some of them are not endings at all. Look carefully. Remember what you see. And before you take another seat, ask yourself: who was the last person to board this bus?"
