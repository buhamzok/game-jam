                      - generic: by blacklight
                      - generic: "Tiny monsters. Big escape. Plan an untimed rescue, then replay with fewer tools. Campaign offers 48 handcrafted rooms across nine worlds. Directional moonlight wakes the wolf: the moon shines along its arrow, Mirrors redirect incoming light, and monsters block the beam. New Mirrors face left; tap a placed Mirror to turn it, or hold to remove it. Garlic, bells, floor arrows and Slime combine into complete-plan puzzles. Place tools freely on any floor, including unhelpful positions, and inspect or replay the chain to understand what happened. The opening teaches Garlic and the beam one at a time, with optional demonstrations, followed by an unguided transfer challenge. How to Play keeps manual practice available. Launch lessons and new-rule reminders have separate settings. Classic and the original directional campaign remain available with their original puzzles and records. The current campaign refines Chain of cinders; unaffected records carry forward while that revised room earns its own score. Optional vampire/golem replay goals are available on Two ways out, Make room and Later chime. Survival gives you one limited bag for twelve rooms. Existing runs retain their saved rules and progress. New runs can use Directional moon; Original, Second wind and Crossing exchange remain available. Personal records are separated by rules and code. Workshop is your own 7-by-5 room builder. Save drafts, undo or redo, test a complete plan, and share draft or rescue-checked codes. Edit plan keeps placed tools. New rooms use directional PRW2 codes, while existing PRW1 rooms and records keep their original rules. If cloud storage fails, you can still test and copy a recovery code; unsaved changes are clearly marked. There is no public community catalogue. Choose among 64 freely selectable looks in Themes. Original is the default and Paper theatre remains optional. Theme choice is remembered on this device separately from gameplay progress. Music and ambience are separate, off-by-default options. Hungry Greenhouse explores Slime's disappearing scents; Clock Garden explores repeating monster timing and clearing a shared lane. Garden connections adds Do not feed the turn and Two signatures: protect a useful scent, then coordinate entries on a sensor that flips its linked gate. The two new rooms append after the existing campaign; their minimum tool counts are not claimed as proved."
