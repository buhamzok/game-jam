                      - generic: by kazuo7
                      - generic: "A dark-fantasy, side-scrolling action platformer with illustrated monsters, hard-hitting melee combat, and agile movement. ARCADE MODE — Available: Battle through 10 increasingly challenging maps. Explore connected rooms, solve lever and gate puzzles, survive sealed combat arenas, dodge spikes, and claim each map’s Relic. Unlock Double Jump and Dash to reach new paths and smash cracked walls. BOSS TRIALS — Available: Choose a boss and a build, then enter a dedicated arena. Face Krazorax’s charges, axe slams, ground projectiles, and spinning leap-cleave. Kick & Punch is available now; four additional builds are coming soon. METROIDVANIA STORY MODE — Coming soon: Discover Eyegor’s origins in a story-driven adventure of exile, vengeance, and a demon’s fight to reclaim his legacy. Includes tutorials and adjustable touch controls, screen shake, and damage flash. HISTORY In the Demon Realm, social standing and raw power are measured by a single metric: the number of eyes a demon possesses. The more eyes you bear, the more feared and respected you become. When Eyegor is born with only a single eye, the supreme Devil orders his immediate banishment. To the demonic hierarchy, a one-eyed spawn is an abominable pariah—a disgraceful stain on the realm. Eyegor’s father submits to the command without hesitation, but his mother refuses to surrender her child. She pays for her defiance with her life. In her dying breath, she casts a powerful protective spell, shrouding the infant from the realm’s gaze until he reaches adulthood. Now, Eyegor emerges from the shadows to reclaim his legacy and avenge the mother who died to protect him."
