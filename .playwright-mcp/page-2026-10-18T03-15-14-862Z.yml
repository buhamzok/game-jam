                      - generic: "You're a scrappy shadow-creature with glowing eyes, and a giant monster-hunter is right behind you. Run through a collapsing gothic castle, wall-running, double-jumping, and sliding past swinging axes, spike pits, and falling chandeliers. Collect soul-orbs to fill your Rage meter, then unleash a roar and smash through everything in your path. HOW TO PLAY - Tap to jump, tap again to double jump - Swipe down to slide - Hold against a wall to wall-run - Stumble twice and the hunter catches you FEATURES - One-tap controls made for mobile and web - Instant 3-second restarts - A new daily castle every day, the same for everyone - Daily leaderboard and global best-distance board - Daily streak that unlocks new creature skins - Original art, spooky but cute Built for October Jam: Monster Mash. Share your best distance and challenge a friend to beat it."
