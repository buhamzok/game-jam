                      - generic: The invitation promised a night to remember. It never mentioned leaving. Step into **THE BALLROOM HAS TEETH**, a horror experience set beneath glittering chandeliers, where the music never stops and the guests have been waiting far too long. Something moves behind the velvet curtains. The doors are no longer where you remember them. And every time the lights go out, you hear chewing. Watch the shadows. Find a way out. Whatever happens, don’t stay for the final dance.
