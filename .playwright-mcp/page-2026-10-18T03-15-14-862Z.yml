                      - generic: by funkiemonkie420
                      - generic: "The city is rotting from the inside out. Infection stains the walls, bodies collapse in the streets, and the air tastes like metal and ash. Every breath feels borrowed. Every shadow hides something that used to be human. The plague doesn’t spread — it devours. You are the last plague doctor still breathing. Not a hero. Not a savior. Just the final survivor of a dying order, clinging to duty while the world decays around you. Your tasks are merciless: Cure what can be saved. Burn what cannot. Recover the keyshards before the city’s heart stops beating. The deeper you go, the worse it gets. Labs abandoned mid‑scream. Alleys soaked in blackened residue. Creatures that remember their old lives just enough to hate you for still having yours. Your tools grow darker. Your mask grows heavier. Your hands stop shaking — not from courage, but from numbness. Hidden in the ruins are forbidden codes, relics of a world that died quietly: A Mouse, born in filth, surviving where humans failed."
