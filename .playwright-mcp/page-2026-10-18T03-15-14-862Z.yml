                      - generic: "The town went dark. Something is watching. Hollow Eyes is a first-person monster shooter: you are the last night watchman of Ashgrove, and your torch is the only light. Fight through a campaign of missions: light the ward lamps, gather lamp oil, hold the chapel square, and bring down the Bone Prior, the charging Grave Brute and the Hundred-Eyed One. Every night there is a new Night Hunt with a twist (Blood Moon, Blackout, Red Eyes, Swarm, Brute Night, and the Monster Mash, when every kind of monster comes at once) and a streak to keep. Kill three different monsters in one combo for a MONSTER MASH bonus. Challenge a friend to beat your time on any mission. Shoot the glowing eyes for double damage, flash them blind with Dawn Flare, chain lightning with Soul Chain, slow time with Hollow Sight, and draw the Hollow Blade when the hounds get close. Earn up to three stars per mission and spend Souls at the Soul Altar on upgrades that last. Touch or mouse and keyboard. Made for October Jam: Monster Mash."
