                      - generic: "One eye. No legs. Plenty of firepower. Slimepunk is a chaotic survival action game for solo players or up to eight friends. Become a strange little slime, grow a ridiculous arsenal of weapon-wielding arms and battle through nights packed with relentless enemies. Mix weapons, abilities and powerful items to build your own walking disaster—minus the walking. Souls flow straight to you as enemies fall, while scattered loot offers new strengths, useful bonuses and unexpected trade-offs. Combine weapons between nights and push your build further as the hordes grow tougher. Face monstrous bosses with multiple health stages, deadly projectiles and changing attack patterns. Beware the Mirror Alpha: a sinister red-eyed version of your slime that copies your equipment and teleports around the battlefield while enemies keep pouring in. Fight together, experiment with outrageous builds and see how long your little blob can survive."
