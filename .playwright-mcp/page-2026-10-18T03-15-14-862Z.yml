                      - generic: "Turn the tables on tower defence: you command the monsters. Each attack gives you five rounds to break a crystal guarded by towers, and the defence builds and adapts between rounds. Spend your gold on grunts, runners and brutes, send them down the road in waves, and call a Quake to stun the towers when the march stalls. Every round earns essence: unlock ogres and the boss, and train your army with tougher hides, quicker feet and a bigger war chest. Win to climb the tiers from Bronze to Mythic, lose and you drop one. Challenge Monster Defence players face to face. Choose your side in the weekly war: every game here scores for the monsters, every game of Monster Defence scores for the defenders, and the bar on the menu shows who is ahead this week. Fight for the defenders instead in Monster Defence: https://w.run/tbrewerton/monster-defence-td"
