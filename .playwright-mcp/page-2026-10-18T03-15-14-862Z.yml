                      - generic: by tyrileytattoos
                      - generic: "Seal every Gate. One DMN each. DMNDOKU is a pure logic puzzle with a demonic streak. Every board is split into colored Gates, and your job is to place exactly one DMN in each Gate, each row, and each column. The catch: DMNs can never touch, not even diagonally. No guessing, ever. Every one of the 200 levels has a single solution you can reach by logic alone. Tap to mark where a DMN can't go, double-tap to place one, and keep your three souls intact. - 200 handcrafted-fair levels, from quick 5x5 boards to brutal 10x10 grids - A guided tutorial that teaches the game in under a minute - Streaks that crank up the effects the cleaner you play - Demonic voice callouts, best times, and 3-star ratings on every level - Hints when you're stuck Easy to learn. Wicked to master."
