                      - generic: by radiantorbit578
                      - generic: Mash two monsters into one. Kill a knight, then raise his body to fight beside you. 72 hybrids, each one drawn the moment you make it. You are the monster. Humans are burning their way through the hills — militia, hunters, knights, inquisitors, and a paladin captain whose orders do not mention prisoners. Grimhollow is the last monster town, and its guild pays you to push the purge back one column at a time. Every human you drop leaves a body. Click it and it gets up and joins your warband. Take two of your monsters to the Mashing Bench in the guild hall and they both go in; one comes out carrying a power from each parent. 72 pairings, 72 creatures, each drawn from its parents the moment you make it. Enemies wind up before they strike. The icon over their head is the move, the bar underneath is how long you have. Guard before it fills and the blow glances off. Health does not come back between rooms, so a door that pays well is a door that costs you something. Five contracts, fifteen fights, nine monsters to play as. About twenty minutes to the ending. Keyboard and mouse, no install.
