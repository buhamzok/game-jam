                        - generic [ref=f6e14827]: Game
                      - generic: by goldenpixel295
                      - generic: "Monster Mash: Beat Brawl is a portrait-mode mobile rhythm game built with Pixi.js and React. The game features a colorful Halloween monster concert with a main menu, campaign level selection, gameplay HUD, and results screen. Players hit the beat using A/S/D/F controls, build combos, and compete across 20 unique tracks spanning four difficulty levels: Easy, Normal, Hard, and Extreme. The game includes score tracking, accuracy ratings, level progression, personal best, and a leaderboard. Players earn points by hitting notes in time with the music using the A/S/D/F controls. Accurate hits earn better results, while missed notes reduce accuracy and break the current combo. Consecutive successful hits build a combo, and maintaining a high combo helps players achieve a higher score. Hold notes require players to keep the input pressed until the note finishes. At the end of each level, players receive a grade based on their performance, along with their final score, accuracy, maximum combo."
