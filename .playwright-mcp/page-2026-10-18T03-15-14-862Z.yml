                      - generic: "Madame Hex is throwing the monster party of the century, and you’re the gargoyle on the door. The trouble is that humans keep turning up in rubber masks and bedsheet ghost costumes, hoping to slip inside. Check every guest before they get in: 🪞 Mirror: does a vampire really have no reflection? 🔦 Flashlight: look for zippers, price tags and fake fur. 🩺 Stethoscope: zombies shouldn’t have a heartbeat. 👉 Poke them and ask questions. Real monsters know their own kind. Then choose: LET IN or TRAPDOOR. Let a human in and the party is ruined. Drop a real monster and you’ll hear about it from Madame Hex. • Story mode with cutscenes and 3 different endings • Endless Night: how long can you keep the door? • Online 1v1 races against other bouncers • A bestiary to fill and a shop full of treats • Hand-made pixel art and a spooky chiptune soundtrack Trust nobody. Check everybody. No humans allowed. 🎃"
